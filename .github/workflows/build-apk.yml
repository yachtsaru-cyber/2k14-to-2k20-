
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip -q 2K14_TO_2K20_Phone_Build_Ready.zip

      - name: Build APK
        working-directory: 2K14_TO_2K20_Project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2K14-TO-2K20-APK
          path: 2K14_TO_2K20_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
